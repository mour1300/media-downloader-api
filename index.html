<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُنزل الميديا الشامل</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .app-card {
            width: 100%;
            max-width: 450px;
            background: #1e293b;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            border: 1px solid #334155;
            text-align: center;
        }

        .icon-header {
            font-size: 42px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 20px;
            color: #38bdf8;
            margin-bottom: 6px;
        }

        p.description {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        input[type="url"] {
            width: 100%;
            padding: 14px 14px 14px 80px;
            border-radius: 12px;
            border: 2px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="url"]:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        .paste-btn {
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: #334155;
            color: #38bdf8;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .status-msg {
            margin-top: 15px;
            font-size: 13px;
            color: #cbd5e1;
            min-height: 20px;
            word-break: break-word;
        }

        .result-box {
            margin-top: 20px;
        }

        .download-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #22c55e;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            margin-top: 10px;
            transition: background 0.3s;
        }

        .download-btn:hover {
            background: #16a34a;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
        }

        .gallery-card {
            background: #0f172a;
            padding: 8px;
            border-radius: 10px;
            border: 1px solid #334155;
        }

        .gallery-card img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 6px;
        }

        .small-dl-btn {
            display: block;
            background: #0284c7;
            color: white;
            text-decoration: none;
            padding: 6px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="app-card">
    <div class="icon-header">🚀</div>
    <h1>مُنزل الميديا الشامل</h1>
    <p class="description">تنزيل الفيديوهات والصور بأعلى جودة وبدون علامة مائية</p>
    
    <div class="input-group">
        <input type="url" id="mediaUrl" placeholder="ضع رابط الفيديو أو الصورة هنا..." required>
        <button class="paste-btn" onclick="pasteClipboard()">لصق</button>
    </div>

    <button class="submit-btn" onclick="fetchMedia()">بدء التحميل 📥</button>

    <div class="status-msg" id="status"></div>
    <div class="result-box" id="result"></div>
</div>

<script>
    async function pasteClipboard() {
        try {
            const text = await navigator.clipboard.readText();
            document.getElementById('mediaUrl').value = text;
        } catch (err) {
            alert('يرجى السماح بالوصول للحافظة أولاً!');
        }
    }

    async function fetchMedia() {
        const urlInput = document.getElementById('mediaUrl').value.trim();
        const statusDiv = document.getElementById('status');
        const resultDiv = document.getElementById('result');

        if (!urlInput) {
            statusDiv.innerHTML = '<span style="color:#ef4444;">يرجى إدخال الرابط أولاً!</span>';
            return;
        }

        statusDiv.innerHTML = 'جاري معالجة الرابط واستخراج الميديا... ⏳';
        resultDiv.innerHTML = '';

        // نقاط اتصال محرك Cobalt مباشرة من المتصفح
        const API_ENDPOINTS = [
            'https://api.cobalt.tools/api/json',
            'https://co.wuk.sh/api/json'
        ];

        let success = false;

        for (const endpoint of API_ENDPOINTS) {
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        url: urlInput,
                        videoQuality: 'max',
                        filenamePattern: 'basic',
                        filenameStyle: 'basic',
                        isNoWatermark: true,
                        isAudioOnly: false,
                        downloadMode: 'auto'
                    })
                });

                if (!response.ok) continue;

                const data = await response.json();

                if (data.status === 'stream' || data.status === 'redirect' || data.status === 'tunnel') {
                    statusDiv.innerHTML = '<span style="color:#4ade80;">تم تجهيز التحميل بنجاح! 🎉</span>';
                    const downloadUrl = data.url || (data.picker && data.picker[0]?.url);
                    resultDiv.innerHTML = `
                        <a href="${downloadUrl}" target="_blank" rel="noopener noreferrer" class="download-btn">
                            حفظ الفيديو بأعلى جودة ⬇️
                        </a>
                    `;
                    success = true;
                    break;
                } else if (data.status === 'picker' && Array.isArray(data.picker)) {
                    statusDiv.innerHTML = '<span style="color:#4ade80;">تم تجهيز التحميل بنجاح! 🎉</span>';
                    let html = '<div class="gallery-grid">';
                    data.picker.forEach((item, index) => {
                        const imgUrl = item.thumb || item.url;
                        const dlUrl = item.url;
                        html += `
                            <div class="gallery-card">
                                <img src="${imgUrl}" alt="صورة ${index + 1}" />
                                <a href="${dlUrl}" target="_blank" rel="noopener noreferrer" class="small-dl-btn">تحميل صورة ${index + 1}</a>
                            </div>
                        `;
                    });
                    html += '</div>';
                    resultDiv.innerHTML = html;
                    success = true;
                    break;
                } else if (data.text || data.message) {
                    statusDiv.innerHTML = `<span style="color:#ef4444;">خطأ: ${data.text || data.message}</span>`;
                    success = true;
                    break;
                }
            } catch (err) {
                console.warn(`فشل الاتصال بـ ${endpoint}:`, err);
            }
        }

        if (!success) {
            statusDiv.innerHTML = '<span style="color:#ef4444;">تعذر معالجة الرابط! تأكد من صحة الرابط أو حاول مجدداً.</span>';
        }
    }
</script>

</body>
</html>
